[project]
name = "qualia-research"
version = "0.1.0"
description = "Local-first qualitative coding you can audit"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.142,<0.143", "uvicorn>=0.54,<0.55", "typer>=0.27,<0.28",
  "pydantic>=2.13,<2.14", "httpx>=0.28,<1", "scikit-learn>=1.9,<1.10",
]

[project.scripts]
qualia = "qualia.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qualia"
module-root = ""

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15", "pip-audit>=2.9", "krippendorff==0.8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in subscription CLI or external API calls"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
